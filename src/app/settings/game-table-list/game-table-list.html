<p-table lazy="true" dataKey="number" [loading]="loading()" [value]="data()" paginator="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" showCurrentPageReport="true"
  currentPageReportTemplate="Total: {totalRecords}" (onPage)="onPageChange($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Mesa <p-sortIcon field="name" /></th>
      <th pSortableColumn="description">Descripción <p-sortIcon field="description" /></th>
      <th class="w-40"></th>
    </tr>
  </ng-template>
  <ng-template #body let-table>
    <tr>
      <td>{{ table.name }}</td>
      <td>{{ table.description }}</td>
      <td class="w-40">
        <p-button icon="pi pi-pencil" severity="secondary" [disabled]="!editable()" aria-label="Editar"
          (click)="edit.emit(table)" rounded text />
        <p-button icon="pi pi-trash" severity="danger" [disabled]="!deletable()" aria-label="Borrar"
          (click)="confirmDelete($event, table)" rounded text />
      </td>
    </tr>
  </ng-template>
</p-table>
