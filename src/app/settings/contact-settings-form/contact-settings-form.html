<form [formGroup]="form" (ngSubmit)="onSave()" novalidate class="space-y-5">

  <div class="space-y-2">
    <label for="emailInput" class="block font-medium text-gray-950">Email</label>

    <p-iconfield class="block w-full">
      <p-inputicon class="pi pi-envelope" />
      <input pInputText type="text" id="emailInput" formControlName="email" class="w-full" />
    </p-iconfield>
  </div>

  <div class="space-y-2">
    <label for="instagramInput" class="block font-medium text-gray-950">Instagram</label>

    <p-iconfield class="block w-full">
      <p-inputicon class="pi pi-instagram" />
      <input pInputText type="text" id="instagramInput" formControlName="instagram" class="w-full" />
    </p-iconfield>
  </div>

  <div class="space-y-2">
    <label for="googleMapsInput" class="block font-medium text-gray-950">Google maps</label>

    <p-iconfield class="block w-full">
      <p-inputicon class="pi pi-map-marker" />
      <input pInputText type="text" id="googleMapsInput" formControlName="googleMaps" class="w-full" />
    </p-iconfield>
  </div>

  <div class="space-y-2">
    <label for="teamUpInput" class="block font-medium text-gray-950">Team Up</label>

    <p-iconfield class="block w-full">
      <p-inputicon class="pi pi-calendar" />
      <input pInputText type="text" id="teamUpInput" formControlName="teamUp" class="w-full" />
    </p-iconfield>
  </div>

  <p-button type="submit" name="Guardar" [loading]="loading()">
    Guardar
  </p-button>
</form>
