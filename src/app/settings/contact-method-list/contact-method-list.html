<p-menu #actionsMenu [model]="actions" [popup]="true" />

<p-table lazy="true" dataKey="number" [loading]="loading()" [value]="data()" paginator="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" showCurrentPageReport="true"
  currentPageReportTemplate="Total: {totalRecords}" (onPage)="onPageChange($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Método <p-sortIcon field="name" /></th>
      <th class="w-40"></th>
    </tr>
  </ng-template>
  <ng-template #body let-profile>
    <tr>
      <td>{{ profile.name }}</td>
      <td class="w-40">
        <p-button icon="pi pi-eye" severity="secondary" ariaLabel="Ver detalles"
          (click)="show.emit(profile)" rounded text />
        @if (deletable()) {
          <p-button icon="pi pi-ellipsis-v" severity="secondary" ariaLabel="Más acciones"
            (click)="openActionsMenu($event, profile)" rounded text />
        }
      </td>
    </tr>
  </ng-template>
</p-table>
