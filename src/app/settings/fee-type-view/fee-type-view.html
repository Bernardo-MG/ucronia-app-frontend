<div class="p-4 space-y-6">
  <header class="flex items-center justify-between">
    <h1 class="text-4xl font-bold">Tipos de cuota</h1>
    @if (permissions.create) {
      <p-button icon="pi pi-plus-circle" (click)="dialog = Dialog.CREATE" [disabled]="!permissions.create"
        aria-label="Nuevo tipo de cuota" [attr.aria-disabled]="!permissions.create" rounded />
    }
  </header>

  <div class="max-w-3xl mx-auto space-y-6">
    <assoc-fee-type-list [loading]="loading" [deletable]="permissions.delete"
      [data]="feeTypeData.content" [rows]="feeTypeData.size" [page]="feeTypeData.page"
      [totalRecords]="feeTypeData.totalElements" (show)="onShowInfo($event)" (delete)="onDelete($event)"
      (changePage)="load($event)" />
  </div>
</div>

<p-drawer [visible]="dialog !== Dialog.NONE" (visibleChange)="onDrawerVisibleChange($event)" [closable]="true"
  position="right" [style]="{ width: 'min(44rem, 100vw)' }">
  @switch (dialog) {
    @case (Dialog.INFO) {
      <ng-template #header>Tipo de cuota</ng-template>
      <div class="w-full space-y-4 px-2 py-4 sm:px-4">
        <ui-detail-field [loading]="loading" icon="pi pi-hashtag" name="Número" [value]="selectedData.number" />
        <ui-detail-field [loading]="loading" icon="pi pi-tag" name="Nombre" [value]="selectedData.name" />
        <ui-detail-field [loading]="loading" icon="pi pi-euro" name="Importe" [value]="selectedData.amount + ' €'" />
      </div>
      <ng-template #footer>
        <p-button label="Editar" icon="pi pi-pencil" severity="secondary" [disabled]="!permissions.edit || loading"
          (click)="onShowEdit(selectedData)" />
      </ng-template>
    }

    @case(Dialog.CREATE) {
      <ng-template #header>
        Crear tipo de cuota
      </ng-template>
      <div class="w-full">
        <assoc-fee-type-form [loading]="loading" [failures]="failures" (save)="onCreate($event)" />
      </div>
    }

    @case(Dialog.EDIT) {
      <ng-template #header>
        Editar tipo de cuota
      </ng-template>
      <div class="w-full">
        <assoc-fee-type-form [loading]="loading" [data]="selectedData" [failures]="failures" (save)="onUpdate($event)" />
      </div>
      <ng-template #footer>
        <p-button icon="pi pi-times" severity="secondary" label="Cancelar" (click)="onCancelEdit()" rounded text class="!p-2" />
      </ng-template>
    }

  }
</p-drawer>
