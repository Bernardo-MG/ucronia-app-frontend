<div class="p-4 space-y-6">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <h1 class="text-4xl font-bold">Métodos de contacto</h1>
    @if (permissions.create) {
      <p-button type="button" label="Nuevo método de contacto" icon="pi pi-plus" (onClick)="dialog = Dialog.CREATE" [disabled]="!permissions.create" [attr.aria-disabled]="!permissions.create" />
    }
  </header>

  <div class="max-w-3xl mx-auto space-y-6">
    <assoc-contact-method-list [loading]="loading"
      [data]="contactMethodData.content" [rows]="contactMethodData.size" [page]="contactMethodData.page"
      [totalRecords]="contactMethodData.totalElements" (show)="onShowInfo($event)"
      (changePage)="load($event)" />
  </div>
</div>

<p-drawer [visible]="dialog !== Dialog.NONE" (visibleChange)="onDrawerVisibleChange($event)" [closable]="true"
  position="right" [style]="{ width: 'min(44rem, 100vw)' }">
  @switch (dialog) {
    @case (Dialog.INFO) {
      <ng-template #header>
        <shared-drawer-header title="Método de contacto" icon="pi pi-phone" subtitle="Ajustes / Métodos de contacto" />
      </ng-template>
      <div class="w-full min-w-0 px-2 py-4 sm:px-4">
        <shared-settings-info [loading]="loading" category="Método de contacto" icon="pi pi-phone"
          [number]="selectedData.number" [title]="selectedData.name" />
      </div>
      <ng-template #footer>
        <shared-drawer-actions [deleteDisabled]="!permissions.delete" [editDisabled]="!permissions.edit" [loading]="loading"
          editLabel="Editar método" (delete)="onDelete($event)" (edit)="onShowEdit(selectedData)" />
      </ng-template>
    }

    @case (Dialog.CREATE) {
      <ng-template #header>
        <shared-drawer-header title="Crear método de contacto" icon="pi pi-phone" />
      </ng-template>
      <div class="w-full min-w-0 px-2 py-4 sm:px-4">
        <assoc-contact-method-form #fieldsAssocContactMethodForm formId="contact-method-view-create" [showActions]="false" [loading]="loading" [failures]="failures" (save)="onCreate($event)" />
      </div>
      <ng-template #footer>
        <shared-drawer-form-actions
          formId="contact-method-view-create"
          submitLabel="Crear método"
          submitIcon="pi pi-plus"
          [disabled]="!fieldsAssocContactMethodForm.saveEnabled"
          [loading]="fieldsAssocContactMethodForm.loading()"
          (cancelForm)="onDrawerVisibleChange(false)" />
      </ng-template>
    }

    @case (Dialog.EDIT) {
      <ng-template #header>
        <shared-drawer-header title="Editar método de contacto" icon="pi pi-pencil" />
      </ng-template>
      <div class="w-full min-w-0 px-2 py-4 sm:px-4">
        <assoc-contact-method-form #fieldsAssocContactMethodForm formId="contact-method-view-edit" [showActions]="false" [loading]="loading" [data]="selectedData" [failures]="failures"
          (save)="onUpdate($event)" />
      </div>
      <ng-template #footer>
        <shared-drawer-form-actions
          formId="contact-method-view-edit"
          submitLabel="Guardar cambios"
          submitIcon="pi pi-check"
          [disabled]="!fieldsAssocContactMethodForm.saveEnabled"
          [loading]="fieldsAssocContactMethodForm.loading()"
          (cancelForm)="onCancelEdit()" />
      </ng-template>

    }

  }
</p-drawer>
