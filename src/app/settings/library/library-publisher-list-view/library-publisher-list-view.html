<div class="p-4 space-y-6">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <h1 class="text-4xl font-bold">Editoriales</h1>
    @if (permissions.create) {
      <p-button label="Nueva editorial" icon="pi pi-plus" (click)="onShowCreate()" [disabled]="!permissions.create" [attr.aria-disabled]="!permissions.create" />
    }
  </header>
  <shared-name-list [data]="data" [loading]="loading" (show)="onShowInfo($event)"
    (sortChange)="onSort($event)" (pageChange)="load($event)"></shared-name-list>
</div>

<p-drawer [visible]="drawer !== Drawer.NONE" (visibleChange)="onDrawerVisibleChange($event)" [closable]="true"
  position="right" [style]="{ width: 'min(44rem, 100vw)' }">
  @switch (drawer) {
    @case (Drawer.INFO) {
      <ng-template #header>
        Editorial
      </ng-template>
      <div>
        <ui-detail-field [loading]="loading" icon="pi pi-hashtag" name="Número" [value]="selected.number" />
        <ui-detail-field [loading]="loading" icon="pi pi-user" name="Nombre" [value]="selected.name" />
      </div>
      <ng-template #footer>
        <shared-drawer-actions [deleteDisabled]="!permissions.delete" [editDisabled]="!permissions.edit" [loading]="loading"
          editLabel="Editar editorial" (delete)="onDelete($event)" (edit)="onShowEdit(selected)" />
      </ng-template>
    }
    @case (Drawer.CREATION) {
      <ng-template #header>
        Crear editorial
      </ng-template>
      <div class="w-full">
        <shared-name-form #fieldsSharedNameForm formId="library-publisher-list-view-creation" [showActions]="false" [loading]="loading" [failures]="failures" (save)="onSave($event)"></shared-name-form>
      </div>
      <ng-template #footer>
        <shared-drawer-form-actions
          formId="library-publisher-list-view-creation"
          submitLabel="Crear"
          submitIcon="pi pi-plus"
          [disabled]="!fieldsSharedNameForm.saveEnabled"
          [loading]="fieldsSharedNameForm.loading()"
          (cancelForm)="onReject()" />
      </ng-template>

    }
    @case (Drawer.EDITION) {
      <ng-template #header>
        Modificar editorial
      </ng-template>
      <div class="w-full">
        <shared-name-form #fieldsSharedNameForm formId="library-publisher-list-view-edition" [showActions]="false" [data]="selected" [loading]="loading" [failures]="failures" (save)="onSave($event)"></shared-name-form>
      </div>
      <ng-template #footer>
        <shared-drawer-form-actions
          formId="library-publisher-list-view-edition"
          submitLabel="Guardar cambios"
          submitIcon="pi pi-check"
          [disabled]="!fieldsSharedNameForm.saveEnabled"
          [loading]="fieldsSharedNameForm.loading()"
          (cancelForm)="onCancelEdit()" />
      </ng-template>

    }
  }
</p-drawer>
