<form [attr.id]="formId()" class="w-full min-w-0 space-y-5" [formGroup]="form" (ngSubmit)="onSave()" novalidate>
  <section class="space-y-5 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <div>
      <label for="nameInput" class="block font-medium text-gray-950">Nombre <span class="text-red-600" aria-hidden="true">*</span></label>
      <input pInputText id="nameInput" type="text" formControlName="name" maxlength="50" class="mt-2 w-full" [invalid]="isFieldInvalid('name')" />
      @for (failure of failures().getFailures('name'); track failure) {
        <p-message class="mt-1 block" severity="error" size="small" variant="simple">{{ failure.message }}</p-message>
      }
    </div>
    <div>
      <label for="amountInput" class="block font-medium text-gray-950">Importe <span class="text-red-600" aria-hidden="true">*</span></label>
      <p-inputnumber inputId="amountInput" formControlName="amount" mode="currency" currency="EUR"
      class="mt-2 w-full" [invalid]="isFieldInvalid('amount')" />
      @for (failure of failures().getFailures('amount'); track failure) {
        <p-message class="mt-1 block" severity="error" size="small" variant="simple">{{ failure.message }}</p-message>
      }
    </div>
  </section>
  @if (showActions()) {
    <shared-drawer-form-actions class="mt-6" [submitLabel]="isEdit ? 'Guardar cambios' : 'Crear tipo de cuota'"
      [submitIcon]="isEdit ? 'pi pi-check' : 'pi pi-plus'"
      [disabled]="!saveEnabled" [loading]="loading()" (cancelForm)="cancelEdition.emit()" />
  }
</form>
