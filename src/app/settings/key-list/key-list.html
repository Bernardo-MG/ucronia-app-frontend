<p-table lazy="true" dataKey="number" [loading]="loading()" [value]="data()" paginator="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" showCurrentPageReport="true"
  currentPageReportTemplate="Total: {totalRecords}" (onPage)="onPageChange($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="number">Numero <p-sortIcon field="number" /></th>
      <th>Estado</th>
      <th>Descripcion</th>
      <th class="w-40"></th>
    </tr>
  </ng-template>
  <ng-template #body let-key>
    <tr>
      <td>
        {{ key.number }}
      </td>
      <td><p-tag [value]="key.available ? 'Disponible' : 'Perdida'"
        [severity]="key.available ? 'success' : 'danger'" /></td>
      <td>{{ key.description }}</td>
      <td class="w-40">
        <p-button icon="pi pi-eye" severity="secondary" ariaLabel="Ver detalles"
          (click)="show.emit(key)" rounded text />
      </td>
    </tr>
  </ng-template>
</p-table>
