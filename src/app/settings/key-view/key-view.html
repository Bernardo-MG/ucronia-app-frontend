<div class="p-4 space-y-6">
  <header class="flex items-center justify-between">
    <h1 class="text-4xl font-bold">Llaves</h1>
    @if (permissions.create) {
      <p-button icon="pi pi-plus-circle" (click)="dialog = Dialog.CREATE" [disabled]="!permissions.create"
        aria-label="Nueva llave" [attr.aria-disabled]="!permissions.create" rounded />
    }
  </header>

  <div class="max-w-3xl mx-auto space-y-6">
    <assoc-key-list [loading]="loading" [editable]="permissions.edit" [deletable]="permissions.delete" [data]="keys.content"
      [rows]="keys.size" [page]="keys.page" [totalRecords]="keys.totalElements" (edit)="onShowEdit($event)"
      (delete)="onDelete($event)" (changePage)="load($event)" />
  </div>
</div>

@switch (dialog) {

  @case(Dialog.CREATE) {
    <ng-template #header>
      Crear llave
    </ng-template>
    <div class="w-full">
      <assoc-key-form [loading]="loading" [failures]="failures" (save)="onCreate($event)" />
    </div>
  }

  @case(Dialog.EDIT) {
    <ng-template #header>
      Editar llave
    </ng-template>
    <div class="w-full">
      <assoc-key-form [loading]="loading" [data]="selectedData" [failures]="failures" (save)="onUpdate($event)" />
    </div>
    <ng-template #footer>
      <p-button icon="pi pi-times" severity="secondary" (click)="dialog = Dialog.NONE" rounded text class="!p-2" />
    </ng-template>
  }

}
