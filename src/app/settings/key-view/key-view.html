<div class="p-4 space-y-6">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <h1 class="text-4xl font-bold">Llaves</h1>
    @if (permissions.create) {
      <p-button type="button" label="Nueva llave" icon="pi pi-plus" (onClick)="dialog = Dialog.CREATE" [disabled]="!permissions.create" [attr.aria-disabled]="!permissions.create" />
    }
  </header>

  <div class="max-w-3xl mx-auto space-y-6">
    <assoc-key-list [loading]="loading" [data]="keys.content"
      [rows]="keys.size" [page]="keys.page" [totalRecords]="keys.totalElements" (show)="onShowInfo($event)"
      (changePage)="load($event)" />
  </div>
</div>

<p-drawer [visible]="dialog !== Dialog.NONE" (visibleChange)="onDrawerVisibleChange($event)" [closable]="true"
  position="right" [style]="{ width: 'min(44rem, 100vw)' }">
  @switch (dialog) {
    @case (Dialog.INFO) {
      <ng-template #header>
        <shared-drawer-header title="Detalle de llave" icon="pi pi-key" subtitle="Ajustes / Llaves" />
      </ng-template>
      <div class="w-full min-w-0 px-2 py-4 sm:px-4">
        <shared-settings-info [loading]="loading" category="Llave" icon="pi pi-key"
          [number]="selectedData.number" [title]="'Llave #' + selectedData.number" [status]="selectedData.available ? 'Disponible' : 'Perdida'" [positiveStatus]="selectedData.available" [showReference]="false" [showDescription]="true" [description]="selectedData.description" />
      </div>
      <ng-template #footer>
        <shared-drawer-actions [deleteDisabled]="!permissions.delete" [editDisabled]="!permissions.edit" [loading]="loading"
          editLabel="Editar llave" (delete)="onDelete($event)" (edit)="onShowEdit(selectedData)" />
      </ng-template>
    }

    @case(Dialog.CREATE) {
      <ng-template #header>
        <shared-drawer-header title="Crear llave" icon="pi pi-key" />
      </ng-template>
      <div class="w-full min-w-0 px-2 py-4 sm:px-4">
        <assoc-key-form #fieldsAssocKeyForm formId="key-view-create" [showActions]="false" [loading]="loading" [failures]="failures" (save)="onCreate($event)" />
      </div>
      <ng-template #footer>
        <shared-drawer-form-actions
          formId="key-view-create"
          submitLabel="Crear llave"
          submitIcon="pi pi-plus"
          [disabled]="!fieldsAssocKeyForm.saveEnabled"
          [loading]="fieldsAssocKeyForm.formStatus.loading"
          (cancelForm)="onDrawerVisibleChange(false)" />
      </ng-template>
    }

    @case(Dialog.EDIT) {
      <ng-template #header>
        <shared-drawer-header title="Editar llave" icon="pi pi-pencil" />
      </ng-template>
      <div class="w-full min-w-0 px-2 py-4 sm:px-4">
        <assoc-key-form #fieldsAssocKeyForm formId="key-view-edit" [showActions]="false" [loading]="loading" [data]="selectedData" [failures]="failures" (save)="onUpdate($event)" />
      </div>
      <ng-template #footer>
        <shared-drawer-form-actions
          formId="key-view-edit"
          submitLabel="Guardar cambios"
          submitIcon="pi pi-check"
          [disabled]="!fieldsAssocKeyForm.saveEnabled"
          [loading]="fieldsAssocKeyForm.formStatus.loading"
          (cancelForm)="onCancelEdit()" />
      </ng-template>

    }

  }
</p-drawer>
