<div class="rounded-lg border border-gray-200 bg-white shadow-sm">
  @if (loading()) {
    <div class="flex items-center gap-4 p-5">
      <span class="flex size-12 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-400">
        <i class="pi pi-id-card text-xl" aria-hidden="true"></i>
      </span>

      <div class="space-y-2">
        <div class="h-5 w-40 animate-pulse rounded bg-gray-200"></div>
        <div class="h-4 w-56 animate-pulse rounded bg-gray-100"></div>
      </div>
    </div>
  } @else if (data(); as profile) {
    <div class="flex items-center gap-4 border-b border-gray-200 p-5">
      <span class="flex size-12 shrink-0 items-center justify-center rounded-full bg-violet-100 text-violet-700">
        <i class="pi pi-id-card text-xl" aria-hidden="true"></i>
      </span>

      <div class="min-w-0">
        <p class="truncate font-semibold text-gray-950">
          {{ memberName }}
        </p>

        <p class="text-sm text-gray-500">
          Socio número {{ profile.number }}
        </p>
      </div>
    </div>

    <div class="divide-y divide-gray-200 px-5">
      <div class="py-4">
        <ui-detail-field icon="pi pi-hashtag" name="Número de socio" [value]="profile.number" />
      </div>

      <div class="py-4">
        <ui-detail-field icon="pi pi-user" name="Nombre" [value]="profile.name.firstName" />
      </div>

      <div class="py-4">
        <ui-detail-field icon="pi pi-users" name="Apellidos" [value]="profile.name.lastName" />
      </div>

      <div class="py-4">
        <ui-detail-field icon="pi pi-id-card" name="DNI" [value]="profile.identifier" />
      </div>
    </div>
  } @else {
    <div class="flex items-center gap-4 p-5">
      <span class="flex size-12 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-500">
        <i class="pi pi-id-card text-xl" aria-hidden="true"></i>
      </span>

      <div>
        <p class="font-semibold text-gray-950">
          Sin miembro asignado
        </p>

        <p class="text-sm text-gray-500">
          Esta cuenta no está vinculada a ningún socio
        </p>
      </div>
    </div>
  }
</div>
