<form
  [formGroup]="form"
  class="space-y-4"
  (ngSubmit)="onSave()"
>
  <div
    class="
      grid gap-2
      md:grid-cols-[13rem_minmax(0,1fr)]
      md:items-center
    "
  >
    <label
      for="oldPasswordInput"
      class="text-sm font-medium text-gray-800"
    >
      Contraseña actual
    </label>

    <div>
      <input
        pInputText
        id="oldPasswordInput"
        type="password"
        class="w-full"
        formControlName="oldPassword"
        autocomplete="current-password"
        [invalid]="isFieldInvalid('oldPassword')"
      />

      @for (
        failure of failures().getFailures('oldPassword');
        track failure
      ) {
        <p-message
          severity="error"
          size="small"
          variant="simple"
        >
          {{ failure.message }}
        </p-message>
      }
    </div>
  </div>

  <div
    class="
      grid gap-2
      md:grid-cols-[13rem_minmax(0,1fr)]
      md:items-center
    "
  >
    <label
      for="newPasswordInput"
      class="text-sm font-medium text-gray-800"
    >
      Nueva contraseña
    </label>

    <div>
      <input
        pInputText
        id="newPasswordInput"
        type="password"
        class="w-full"
        formControlName="newPassword"
        autocomplete="new-password"
        [invalid]="isFieldInvalid('newPassword')"
      />

      @for (
        failure of failures().getFailures('newPassword');
        track failure
      ) {
        <p-message
          severity="error"
          size="small"
          variant="simple"
        >
          {{ failure.message }}
        </p-message>
      }
    </div>
  </div>

  <div
    class="
      grid gap-2
      md:grid-cols-[13rem_minmax(0,1fr)]
      md:items-center
    "
  >
    <label
      for="passwordRepeatInput"
      class="text-sm font-medium text-gray-800"
    >
      Confirmar contraseña
    </label>

    <div>
      <input
        pInputText
        id="passwordRepeatInput"
        type="password"
        class="w-full"
        formControlName="passwordRepeat"
        autocomplete="new-password"
        [invalid]="isFieldInvalid('passwordRepeat')"
      />

      @for (
        failure of failures().getFailures('passwordRepeat');
        track failure
      ) {
        <p-message
          severity="error"
          size="small"
          variant="simple"
        >
          {{ failure.message }}
        </p-message>
      }
    </div>
  </div>

  <div class="flex justify-end pt-2">
    <p-button
      type="submit"
      label="Actualizar contraseña"
      icon="pi pi-lock"
      [loading]="loading()"
      [disabled]="!formStatus.saveEnabled"
      [attr.aria-disabled]="!formStatus.saveEnabled"
    />
  </div>
</form>
