<p-table
  lazy="true"
  dataKey="month"
  [loading]="loading()"
  [value]="fees()"
  paginator="true"
  [rows]="rows()"
  [totalRecords]="totalRecords()"
  [first]="first"
  showCurrentPageReport="true"
  currentPageReportTemplate="{first}–{last} de {totalRecords}"
  (onPage)="onPageChange($event)"
  responsiveLayout="scroll"
  styleClass="p-datatable-striped">

  <ng-template #header>
    <tr>
      <th>Periodo</th>
      <th class="hidden sm:table-cell">Tipo de cuota</th>
      <th class="text-right">Importe</th>
      <th>Estado</th>
      <th>Fecha de pago</th>
    </tr>
  </ng-template>

  <ng-template #body let-fee>
    <tr>
      <td class="font-medium text-gray-950 capitalize">
        {{ fee.month | date:'MMMM y' }}
      </td>

      <td class="hidden text-gray-600 sm:table-cell">
        {{ fee.feeType.name }}
      </td>

      <td class="text-right font-medium tabular-nums">
        {{ fee.feeType.amount | currency:'EUR':'symbol':'1.2-2' }}
      </td>

      <td>
        @if (fee.paid) {
          <p-tag value="Pagada" severity="success" />
        } @else {
          <p-tag value="Pendiente" severity="warn" />
        }
      </td>

      <td>
        @if (fee.paid) {
          <span class="text-gray-700">
            {{ fee.transaction?.date | date:'d MMM y' }}
          </span>
        } @else {
          <span class="text-gray-400">—</span>
        }
      </td>
    </tr>
  </ng-template>

</p-table>
