<p-table lazy="true" dataKey="number" [loading]="loading()" [value]="data()" paginator="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" showCurrentPageReport="true"
  currentPageReportTemplate="Total: {totalRecords}" (onSort)="changeDirection.emit($event)" (onPage)="onPageChange($event)">
  <ng-template #header>
    <tr class="border-b border-gray-200 bg-gray-50">
      <th pSortableColumn="date">Fecha <p-sortIcon field="date" /></th>
      <th pSortableColumn="title">Actividad <p-sortIcon field="title" /></th>
      <th pSortableColumn="location">Lugar <p-sortIcon field="location" /></th>
      <th>Sesiones</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-activity>
    <tr class="hover:bg-gray-50">
      <td>
        <div class="min-w-64 space-y-1">
          @for (date of activity.dates; track date) {
            <div class="flex items-center gap-2 text-sm text-gray-700">
              <i class="pi pi-calendar text-xs text-primary" aria-hidden="true"></i>
              <span>{{ date.start | date:'d MMM y, HH:mm' }}–{{ date.end | date:'HH:mm' }}</span>
            </div>
          } @empty {
            <span class="text-sm text-gray-500">Sin fechas</span>
          }
        </div>
      </td>
      <td><strong class="block text-gray-950">{{ activity.title }}</strong><span class="mt-1 block max-w-xl truncate text-sm text-gray-500">{{ activity.description }}</span></td>
      <td>{{ activity.location || 'Sin lugar' }}</td>
      <td><p-tag [value]="getDatesLabel(activity)" severity="info" /></td>
      <td class="w-20 text-right"><p-button icon="pi pi-eye" severity="secondary" aria-label="Ver" (click)="show.emit(activity)" rounded text /></td>
    </tr>
  </ng-template>
</p-table>
