<div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
  <div>
    <h2 class="text-xl font-semibold text-gray-950">Evolución de socios</h2>
    <p class="mt-1 text-sm text-gray-500">Evolución durante el periodo seleccionado</p>
  </div>
  <p-select [ngModel]="selectedRange" [options]="ranges" optionLabel="label" optionValue="value"
    aria-label="Rango del gráfico" (onChange)="selectedRange = $event.value" />
</div>

<div class="relative h-56 w-full" [attr.aria-busy]="loading">
  <canvas id="memberBalanceChart"></canvas>
</div>

@if (balance.length) {
  <div class="ml-8 grid text-center text-xs capitalize text-gray-500"
    [style.grid-template-columns]="'repeat(' + balance.length + ', minmax(0, 1fr))'">
    @for (entry of balance; track entry.month) {
      <span>{{ entry.month | date:'MMM' }}</span>
    }
  </div>
}
