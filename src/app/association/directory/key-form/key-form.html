<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <p-inputgroup class="mb-2 d-flex">
    <p-inputgroup-addon>
      <i class="pi pi-key"></i>
    </p-inputgroup-addon>
    <p-inputnumber inputId="numberInput" [min]="1" [useGrouping]="false" formControlName="number"
      [invalid]="isFieldInvalid('number')" placeholder="Numero de llave" styleClass="w-full" [readonly]="isEdit" />
  </p-inputgroup>

  <div class="mb-2">
    @for (failure of failures().getFailures('number'); track failure) {
      <p-message severity="error" size="small" variant="simple">
        {{ failure.message }}
      </p-message>
    }
  </div>

  <div class="mb-4">
    <label for="availableInput" class="select-none font-medium">Disponible</label>
    <div class="mt-2">
      <p-toggleswitch inputId="availableInput" formControlName="available" />
    </div>
  </div>

  <p-inputgroup class="mb-2 d-flex">
    <p-inputgroup-addon>
      <i class="pi pi-comment"></i>
    </p-inputgroup-addon>
    <input pInputText type="text" id="descriptionInput" formControlName="description"
      [invalid]="isFieldInvalid('description')" maxlength="250" class="w-100" placeholder="Descripcion" />
  </p-inputgroup>

  <div class="mb-2">
    @for (failure of failures().getFailures('description'); track failure) {
      <p-message severity="error" size="small" variant="simple">
        {{ failure.message }}
      </p-message>
    }
  </div>

  <p-button type="submit" name="Guardar" [disabled]="!formStatus.saveEnabled" [loading]="loading()"
    [attr.aria-disabled]="!formStatus.saveEnabled">Guardar</p-button>
</form>
