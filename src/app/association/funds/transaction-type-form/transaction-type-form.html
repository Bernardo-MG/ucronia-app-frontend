<form [attr.id]="formId()" [formGroup]="form" (ngSubmit)="onSave()" class="space-y-4">
  <fieldset class="space-y-4">
    <div>
      <label for="transaction-type-description" class="block">Descripción</label>
      <input pInputText id="transaction-type-description" formControlName="description"
        maxlength="200" required class="w-full" />
      @for (failure of failures().getFailures('description'); track failure) {
        <p class="text-sm text-red-700" role="alert">{{ failure.message }}</p>
      }
    </div>
    <div>
      <label for="transaction-type-color" class="block">Color</label>
      <input id="transaction-type-color" type="color" formControlName="color" />
      @for (failure of failures().getFailures('color'); track failure) {
        <p class="text-sm text-red-700" role="alert">{{ failure.message }}</p>
      }
    </div>
  </fieldset>
  @if (showActions()) {
    <shared-drawer-form-actions [disabled]="!saveEnabled" [loading]="formStatus.loading"
      submitLabel="Guardar cambios" submitIcon="pi pi-check" (cancelForm)="cancelEdition.emit()" />
  }
</form>
