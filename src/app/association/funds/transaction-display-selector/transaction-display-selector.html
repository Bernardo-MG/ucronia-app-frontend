<p-selectbutton [options]="statusOptions" [(ngModel)]="selectedStatus" optionLabel="label" optionValue="value"
  aria-label="Vista de movimientos" (onChange)="view.emit($event.value)">
  <ng-template #item let-item>
    <span class="inline-flex items-center gap-2">
      <i [class]="item.icon" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
    </span>
  </ng-template>
</p-selectbutton>
