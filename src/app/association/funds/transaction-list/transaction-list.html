<p-table [lazy]="true" dataKey="index" [loading]="loading()" [value]="data()" [paginator]="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} de {totalRecords}" (onSort)="changeDirection.emit($event)" (onPage)="onPageChange($event)" responsiveLayout="scroll">
  <ng-template #header>
    <tr>
      <th pSortableColumn="description" class="min-w-72">Descripción <p-sortIcon field="description" /></th>
      <th class="min-w-28">Tipo</th>
      <th pSortableColumn="amount" class="min-w-36 text-right">Importe <p-sortIcon field="amount" /></th>
      <th pSortableColumn="date" class="min-w-36">Fecha <p-sortIcon field="date" /></th>
      <th class="w-16"><span class="sr-only">Acciones</span></th>
    </tr>
  </ng-template>
  <ng-template #body let-transaction>
    <tr>
      <td class="font-medium text-gray-950">{{ transaction.description }}</td>
      <td>
        <p-tag [value]="transaction.amount >= 0 ? 'Ingreso' : 'Gasto'"
          [severity]="transaction.amount >= 0 ? 'success' : 'danger'" />
      </td>
      <td class="text-right font-semibold tabular-nums" [class.text-green-600]="transaction.amount >= 0"
        [class.text-gray-950]="transaction.amount < 0">
        {{ transaction.amount | currency:'EUR':'symbol':'1.2-2' }}
      </td>
      <td class="text-gray-600">{{ transaction.date | date:'d MMM y' }}</td>
      <td class="text-right">
        <p-button icon="pi pi-eye" severity="secondary" ariaLabel="Ver detalles de la transacción"
          (click)="show.emit(transaction.index)" rounded text />
      </td>
    </tr>
  </ng-template>
</p-table>
