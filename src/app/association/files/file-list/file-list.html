<p-table [lazy]="true" dataKey="number" [loading]="loading()" [value]="files()" [paginator]="true"
  [rows]="rows()" [totalRecords]="totalRecords()" [first]="first" [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} de {totalRecords}" (onSort)="changeDirection.emit($event)"
  (onPage)="onPageChange($event)" responsiveLayout="scroll">
  <ng-template #header>
    <tr>
      <th class="w-20">Tipo</th>
      <th pSortableColumn="name" class="min-w-48">Nombre <p-sortIcon field="name" /></th>
      <th class="min-w-72">Descripción</th>
      <th pSortableColumn="mediaType" class="min-w-36">Archivo <p-sortIcon field="mediaType" /></th>
      <th class="min-w-44">Actualizado</th>
      <th class="w-16"><span class="sr-only">Acciones</span></th>
    </tr>
  </ng-template>
  <ng-template #body let-file>
    <tr class="cursor-pointer transition-colors hover:bg-primary-50/40" tabindex="0"
      (click)="show.emit(file)" (keydown.enter)="show.emit(file)">
      <td><span class="flex size-12 items-center justify-center rounded-lg bg-primary-50 text-primary">
        <i class="pi pi-file text-xl" aria-hidden="true"></i>
      </span></td>
      <td><span class="font-medium text-gray-950">{{ file.name }}</span>
        @if (!file.publicAccess) {
          <span class="ml-2 inline-flex items-center gap-1 rounded-full bg-gray-100 px-2 py-0.5 text-xs text-gray-600">
            <i class="pi pi-lock text-[0.65rem]" aria-hidden="true"></i>Privado
          </span>
        }
      </td>
      <td class="max-w-96 text-gray-600"><span class="line-clamp-2">{{ file.description || 'Sin descripción' }}</span></td>
      <td class="text-gray-600">{{ file.mediaType }} · {{ formatSize(file.size) }}</td>
      <td class="text-gray-600">{{ file.audit.updatedAt || file.audit.createdAt | date:'d MMM y · HH:mm' }}</td>
      <td class="text-right"><p-button icon="pi pi-ellipsis-v" severity="secondary" aria-label="Ver archivo"
        (click)="$event.stopPropagation(); show.emit(file)" rounded text /></td>
    </tr>
  </ng-template>
</p-table>
