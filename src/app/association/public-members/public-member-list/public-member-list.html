<p-table lazy="true" dataKey="number" [loading]="loading()" [value]="members()" paginator="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" showCurrentPageReport="true"
  currentPageReportTemplate="{first}–{last} de {totalRecords}" (onSort)="changeDirection.emit($event)"
  (onPage)="onPageChange($event)" responsiveLayout="scroll" styleClass="p-datatable-striped">

  <ng-template #header>
    <tr>
      <th pSortableColumn="fullName">
        Nombre
        <p-sortIcon field="fullName" />
      </th>
      <th pSortableColumn="number" class="w-40">
        N.º socio
        <p-sortIcon field="number" />
      </th>
      <th class="w-48">Llave</th>
    </tr>
  </ng-template>

  <ng-template #body let-member>
    <tr class="transition-colors hover:bg-primary-50/40">
      <td>
        <span class="font-semibold text-gray-950">{{ member.name.fullName }}</span>
        <assoc-public-member-renew-tag [renew]="member.renew" />
        @if (member.name.nickname) {
          <span class="mt-1 block text-xs text-gray-500">{{ member.name.nickname }}</span>
        }
      </td>
      <td class="font-mono text-sm text-gray-600">#{{ member.number }}</td>
      <td>
        @if (member.key) {
          <span class="inline-flex items-center gap-2 text-gray-700">
            <i class="pi pi-key" aria-hidden="true"></i>
            Llave {{ member.key }}
          </span>
        } @else {
          <span class="text-gray-400">—</span>
        }
      </td>
    </tr>
  </ng-template>

</p-table>
