<div class="mx-auto max-w-screen-2xl space-y-5 p-4 md:p-6">
  <header>
    <h1 class="text-3xl font-bold tracking-tight text-gray-950">Socios</h1>
    <p class="mt-1 text-sm text-gray-500">Consulta los socios activos de la asociación</p>
  </header>

  <p-card styleClass="overflow-hidden">
    <div class="grid grid-cols-1 divide-y divide-gray-200 sm:grid-cols-2 sm:divide-x sm:divide-y-0">
      <div class="flex items-center justify-center gap-4 p-4 md:px-8">
        <span class="flex size-12 shrink-0 items-center justify-center rounded-full bg-green-50 text-green-600">
          <i class="pi pi-users text-xl"></i>
        </span>
        <div>
          <strong class="block text-2xl leading-none">{{ active }}</strong>
          <span class="text-sm text-gray-500">socios activos</span>
        </div>
      </div>
      <div class="flex items-center justify-center gap-4 p-4 md:px-8">
        <span class="flex size-12 shrink-0 items-center justify-center rounded-full bg-amber-50 text-amber-600">
          <i class="pi pi-exclamation-triangle text-xl"></i>
        </span>
        <div>
          <strong class="block text-2xl leading-none">{{ notRenewing }}</strong>
          <span class="text-sm text-gray-500">no renuevan</span>
        </div>
      </div>
    </div>
  </p-card>

  <section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <div class="border-b border-gray-200 p-4">
      <p-iconfield class="block w-full">
        <p-inputicon class="pi pi-search" />
        <input pInputText type="search" [(ngModel)]="filterValue" (ngModelChange)="onFilterChange($event)"
          placeholder="Buscar por nombre…" aria-label="Buscar socios por nombre" class="w-full" maxlength="50" />
      </p-iconfield>
      <p class="mt-3 text-sm text-gray-500">{{ data.totalElements }} socios</p>
    </div>

    <assoc-public-member-list [loading]="status.loading" [members]="data.content" [rows]="data.size" [page]="data.page"
      [totalRecords]="data.totalElements" (changeDirection)="onChangeDirection($event)" (changePage)="load($event)" />
  </section>
</div>
