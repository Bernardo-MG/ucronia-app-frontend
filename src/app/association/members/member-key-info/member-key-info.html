<div class="space-y-5">
  <section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <div class="flex items-start gap-4 p-5">
      <span class="flex size-20 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-blue-600">
        <i class="pi pi-key text-3xl" aria-hidden="true"></i>
      </span>
      <div class="min-w-0 flex-1">
        <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Llave</span>
        <h3 class="mt-1 break-words text-2xl font-bold leading-tight text-gray-950">Llave #{{ data().number }}</h3>
        <span
          class="mt-3 inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
          [class.bg-green-50]="data().available"
          [class.text-green-700]="data().available"
          [class.bg-amber-50]="!data().available"
          [class.text-amber-700]="!data().available">
          <span class="size-1.5 rounded-full bg-current" aria-hidden="true"></span>
          {{ data().available ? 'Disponible' : 'Perdida' }}
        </span>
      </div>
    </div>
  </section>
  <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <h3 class="font-semibold text-gray-950">Descripción</h3>
    <p class="mt-3 whitespace-pre-wrap break-words text-sm leading-relaxed text-gray-700">
      {{ data().description || 'Sin información' }}
    </p>
  </section>
  <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <h3 class="font-semibold text-gray-950">Perfil asignado</h3>
    @if (data().profile; as profile) {
      <p class="mt-3 font-medium text-gray-950">{{ profile.name }}</p>
      <p class="mt-1 text-sm text-gray-500">Perfil #{{ profile.number }}</p>
    } @else {
      <p class="mt-3 text-sm text-gray-500">Sin perfil asignado</p>
    }
  </section>
</div>
