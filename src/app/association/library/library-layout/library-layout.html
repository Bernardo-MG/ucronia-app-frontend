<div class="library-page">
  <div class="library-layout">
    <aside class="library-sidebar">
      <header class="library-sidebar__header">
        <span class="library-sidebar__eyebrow">Asociación</span>
        <h1 class="library-sidebar__title">Biblioteca</h1>
      </header>

      <nav class="library-nav" aria-label="Secciones de la biblioteca">
        @for (section of menuSections; track section.label; let first = $first) {
          <section class="library-nav__section" [class.library-nav__section--divided]="!first">
            <h2 class="library-nav__section-title">{{ section.label }}</h2>

            <div class="library-nav__items">
              @for (item of section.items; track item.routerLink) {
                <a pRipple class="library-nav__item" [routerLink]="item.routerLink"
                  routerLinkActive="library-nav__item--active" #activeLink="routerLinkActive"
                  [attr.aria-current]="activeLink.isActive ? 'page' : null">
                  <i class="library-nav__icon" [class]="item.icon" aria-hidden="true"></i>
                  <span>{{ item.label }}</span>
                </a>
              }
            </div>
          </section>
        }
      </nav>
    </aside>

    <main class="library-content">
      <router-outlet />
    </main>
  </div>
</div>
