<form [attr.id]="formId()" [formGroup]="form" (ngSubmit)="onSave()" novalidate class="w-full min-w-0 space-y-5">
  <section class="space-y-5 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <div class="mb-4">
      <!-- Member -->
      <label [for]="(formId() || 'profile') + '-member-search'" class="block font-medium text-gray-950">Socio <span class="text-red-600" aria-hidden="true">*</span></label>
      <assoc-member-search [inputId]="(formId() || 'profile') + '-member-search'" [disabled]="formStatus.loading" class="mt-2 block w-full" [members]="members()" (selectMember)="onSelectMember($event)"
        (searchMember)="searchMember.emit($event)" />
      <div class="mb-2">
        @if (isFieldInvalid('borrower')) {
          <p-message severity="error" size="small" variant="simple">
            Seleccione un socio válido
          </p-message>
        }
      </div>
    </div>
    <!-- Lending date -->
    <div class="space-y-2">
      <label for="lendingDateInput" class="block font-medium text-gray-950">Fecha <span class="text-red-600" aria-hidden="true">*</span></label>

      <p-datepicker inputId="lendingDateInput" formControlName="lendingDate" [invalid]="isFieldInvalid('lendingDate')"
        dateFormat="dd/mm/yy" [maxDate]="today" appendTo="body" class="w-full" />
      <div>
        @for (failure of failures().getFailures('lendingDate'); track failure) {
          <p-message severity="error" size="small" variant="simple">
            {{failure.message}}
          </p-message>
        }
      </div>
    </div>

    <!-- Save button -->
  </section>
  @if (showActions()) {
    <shared-drawer-form-actions class="mt-6" submitLabel="Prestar libro" submitIcon="pi pi-arrow-right"
      [disabled]="!saveEnabled" [loading]="formStatus.loading" (cancelForm)="cancelEdition.emit()" />
  }
</form>
