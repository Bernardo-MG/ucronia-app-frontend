<form [attr.id]="formId()" [formGroup]="form" (ngSubmit)="onSave()" novalidate class="space-y-5">
  <div class="mb-4">
    <!-- Member -->
    <label class="block font-medium text-gray-950">Socio <span class="text-red-600" aria-hidden="true">*</span></label>
    <assoc-member-search [members]="members()" (selectMember)="onSelectMember($event)"
      (searchMember)="searchMember.emit($event)" />
    <div class="mb-2">
      @if (isFieldInvalid('borrower')) {
        <p-message severity="error" size="small" variant="simple">
          Seleccione un socio válido
        </p-message>
      }
    </div>
  </div>
  <!-- Lending date -->
  <div class="space-y-2">
    <label for="lendingDateInput" class="block font-medium text-gray-950">Fecha <span class="text-red-600" aria-hidden="true">*</span></label>

    <p-datepicker inputId="lendingDateInput" formControlName="lendingDate" [invalid]="isFieldInvalid('lendingDate')"
      dateFormat="yy-mm-dd" [maxDate]="today" appendTo="body" class="w-full" />
    <div>
      @for (failure of failures().getFailures('lendingDate'); track failure) {
        <p-message severity="error" size="small" variant="simple">
          {{failure.message}}
        </p-message>
      }
    </div>
  </div>

  <!-- Save button -->
  @if (showActions()) {
    <shared-drawer-form-actions class="mt-6" submitLabel="Guardar cambios" submitIcon="pi pi-check"
      [disabled]="!saveEnabled" [loading]="loading()" (cancelForm)="cancelEdition.emit()" />
  }
</form>
