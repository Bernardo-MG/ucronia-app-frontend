<form [attr.id]="formId()" [formGroup]="form" (ngSubmit)="onSave()" novalidate class="w-full min-w-0 space-y-5">
  <section class="space-y-5 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
    <!-- Member -->
    <h2>{{memberName}}</h2>
    <!-- Return date -->
    <div class="space-y-2">
      <label for="returnDateInput" class="block font-medium text-gray-950">Fecha <span class="text-red-600" aria-hidden="true">*</span></label>

      <p-datepicker inputId="returnDateInput" formControlName="returnDate" [invalid]="isFieldInvalid('returnDate')"
        dateFormat="dd/mm/yy" [minDate]="lentDate()" [maxDate]="today" appendTo="body" class="w-full" />
      <div>
        @for (failure of failures().getFailures('returnDate'); track failure) {
          <p-message severity="error" size="small" variant="simple">
            {{failure.message}}
          </p-message>
        }
      </div>
    </div>

    <!-- Save button -->
  </section>
  @if (showActions()) {
    <shared-drawer-form-actions class="mt-6" submitLabel="Devolver libro" submitIcon="pi pi-undo"
      [disabled]="!saveEnabled" [loading]="formStatus.loading" (cancelForm)="cancelEdition.emit()" />
  }
</form>
