<p-table lazy="true" dataKey="number" [loading]="loading()" [value]="lendings()" paginator="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" (onSort)="onChangeDirection($event)"
  (onPage)="onPageChange($event)" showCurrentPageReport="true" currentPageReportTemplate="Total: {totalRecords}">
  <ng-template #header>
    <tr>
      <th pSortableColumn="title">Título <p-sortIcon field="title" /></th>
      <th pSortableColumn="fullName">Socio <p-sortIcon field="fullName" /></th>
      <th>Fecha de préstamo</th>
      <th>Días prestado</th>
      <th><span class="sr-only">Acciones</span></th>
    </tr>
  </ng-template>
  <ng-template #body let-lending>
    <tr>
      <td>{{ lending.book.title.fullTitle }}</td>
      <td>{{ getBorrowerName(lending.borrower) }}</td>
      <td>{{ lending.lendingDate | date:'yyyy-MM-dd' }}</td>
      <td>{{ lending.days }}</td>
      <td>
        <p-button type="button" icon="pi pi-eye" severity="secondary" [text]="true"
          [ariaLabel]="'Ver préstamo de ' + lending.book.title.fullTitle" (onClick)="showLending.emit(lending)" />
      </td>
    </tr>
  </ng-template>
</p-table>
