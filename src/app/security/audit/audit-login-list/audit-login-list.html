<p-table [lazy]="true" dataKey="date" [loading]="loading()" [value]="logins()" [paginator]="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} de {totalRecords}" (onSort)="changeDirection.emit($event)"
  (onPage)="onPageChange($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="username">
        Usuario
        <p-sortIcon field="username" />
      </th>

      <th pSortableColumn="date" class="hidden sm:table-cell">
        Fecha y hora
        <p-sortIcon field="date" />
      </th>

      <th class="w-48">
        Resultado
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-login>
    <tr>
      <td class="min-w-0">
        <div class="flex min-w-0 items-center gap-3">
          <span
            class="flex size-9 shrink-0 items-center justify-center rounded-full border border-gray-200 text-gray-500"
            aria-hidden="true">
            <i class="pi pi-user"></i>
          </span>

          <div class="min-w-0">
            <span class="block truncate font-medium text-gray-950">
              {{ login.username }}
            </span>

            <span class="block text-sm text-gray-500 sm:hidden">
              {{ login.date | date:'d MMM y, HH:mm' }}
            </span>
          </div>
        </div>
      </td>

      <td class="hidden whitespace-nowrap text-gray-700 sm:table-cell">
        <time [attr.datetime]="login.date">
          {{ login.date | date:'d MMM y, HH:mm' }}
        </time>
      </td>

      <td>
        @if (login.loggedIn) {
          <p-tag value="Acceso correcto" icon="pi pi-check-circle" severity="success" />
        } @else {
          <p-tag value="Acceso fallido" icon="pi pi-times-circle" severity="danger" />
        }
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="3">
        <div class="flex flex-col items-center px-4 py-12 text-center">
          <span class="mb-3 flex size-12 items-center justify-center rounded-full bg-gray-100 text-gray-500">
            <i class="pi pi-history text-xl" aria-hidden="true"></i>
          </span>

          <strong class="text-gray-950">
            No hay registros
          </strong>

          <span class="mt-1 text-sm text-gray-500">
            Los intentos de acceso aparecerán aquí
          </span>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
