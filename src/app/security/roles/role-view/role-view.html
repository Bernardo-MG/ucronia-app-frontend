<div class="mx-auto max-w-screen-2xl space-y-5 p-4 md:p-6">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-950">
        Roles
      </h1>

      <p class="mt-1 text-sm text-gray-500">
        Configura los niveles de acceso y permisos de la aplicación
      </p>
    </div>

    @if (permissions.create) {
      <p-button type="button" label="Nuevo rol" icon="pi pi-plus" (onClick)="onStartCreation()" />
    }
  </header>

  <section>
    <header class="mb-4">
      <h2 class="text-xl font-semibold text-gray-950">
        Roles de seguridad
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Consulta y gestiona los roles disponibles en la aplicación
      </p>
    </header>

    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
      <access-role-list [loading]="loading" [roles]="data.content" [rows]="data.size" [page]="data.page" [totalRecords]="data.totalElements" (show)="onShowInfo($event)" (changeDirection)="onChangeDirection($event)" (changePage)="load($event)" />
    </div>
  </section>

  <p-drawer [visible]="dialog !== Dialog.NONE" (visibleChange)="onDrawerVisibleChange($event)" [closable]="true" position="right" [style]="{ width: 'min(44rem, 100vw)' }">
    @switch (dialog) {
      @case (Dialog.INFO) {
        <ng-template #header>
        <shared-drawer-header title="Detalle del rol" icon="pi pi-shield" subtitle="Rol de seguridad" />
      </ng-template>

        <div class="w-full min-w-0 px-2 py-4 sm:px-4">
          <access-role-info [data]="selectedData" [loading]="loading" />
        </div>
        <ng-template #footer>
          <shared-drawer-actions [showDelete]="permissions.delete" [showEdit]="permissions.edit" [loading]="loading"
            editLabel="Editar permisos" editIcon="pi pi-key"
            (delete)="onDelete({ event: $event, role: selectedData })" (edit)="onChangePermissions(selectedData)" />
        </ng-template>
      }

      @case (Dialog.CREATE) {
        <ng-template #header>
        <shared-drawer-header title="Crear rol" icon="pi pi-shield" subtitle="Define el nombre y los permisos del nuevo rol" />
      </ng-template>

        <div class="w-full min-w-0 px-2 py-4 sm:px-4">
          <access-role-form #fieldsAccessRoleForm formId="role-view-create" [showActions]="false" [selection]="resourcePermissions" [loading]="loading" [failures]="failures" (save)="onCreate($event)" />
        </div>
        <ng-template #footer>
          <shared-drawer-form-actions
            formId="role-view-create"
            submitLabel="Crear rol"
            submitIcon="pi pi-plus"
            [disabled]="!fieldsAccessRoleForm.saveEnabled"
            [loading]="fieldsAccessRoleForm.formStatus.loading"
            (cancelForm)="onDrawerVisibleChange(false)" />
        </ng-template>
      }

      @case (Dialog.PERMISSIONS) {
        <ng-template #header>
        <shared-drawer-header title="Editar rol" icon="pi pi-pencil" subtitle="Actualiza los permisos asignados" />
      </ng-template>

        <div class="w-full min-w-0 px-2 py-4 sm:px-4">
          <access-role-change-permission #fieldsAccessRoleChangePermission formId="role-view-permissions" [showActions]="false" [data]="selectedData" [selection]="resourcePermissions" [permissions]="selectedData.permissions" [loading]="loading" (save)="onSetRolePermissions($event)" />
        </div>
        <ng-template #footer>
          <shared-drawer-form-actions
            formId="role-view-permissions"
            submitLabel="Guardar cambios"
            submitIcon="pi pi-check"
            [disabled]="!fieldsAccessRoleChangePermission.saveEnabled"
            [loading]="fieldsAccessRoleChangePermission.formStatus.loading"
            (cancelForm)="onCancelEdit()" />
        </ng-template>
      }
    }
  </p-drawer>
</div>
