<div class="security-page">
  <div class="security-layout">
    <aside class="security-sidebar">
      <header class="security-sidebar__header">
        <span class="security-sidebar__eyebrow">
          Administración
        </span>

        <h1 class="security-sidebar__title">
          Seguridad
        </h1>
      </header>

      <nav class="security-nav" aria-label="Administración de seguridad">
        <section class="security-nav__section">
          <h2 class="security-nav__section-title">
            Seguridad
          </h2>

          <div class="security-nav__items">
            @for (item of menus; track item.routerLink) {
              <a pRipple class="security-nav__item" [routerLink]="item.routerLink"
                routerLinkActive="security-nav__item--active" #activeLink="routerLinkActive"
                [attr.aria-current]="activeLink.isActive ? 'page' : null">
                <i class="security-nav__icon" [class]="item.icon" aria-hidden="true"></i>

                <span>{{ item.label }}</span>
              </a>
            }
          </div>
        </section>
      </nav>
    </aside>

    <main class="security-content">
      <p-card class="h-full">
        <router-outlet />
      </p-card>
    </main>
  </div>
</div>
