<div class="flex flex-wrap gap-1">
  @if (user().enabled) {
    <p-tag value="Activo" severity="success" />
  } @else {
    <p-tag value="Desactivado" severity="warn" />
  }

  @if (!user().notLocked) {
    <p-tag value="Bloqueado" severity="danger" />
  }

  @if (!user().notExpired) {
    <p-tag value="Expirado" severity="warn" />
  }

  @if (!user().passwordNotExpired) {
    <p-tag value="Contraseña expirada" severity="warn" />
  }
</div>
