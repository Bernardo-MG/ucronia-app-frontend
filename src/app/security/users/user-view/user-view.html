<div class="mx-auto max-w-screen-2xl space-y-5 p-4 md:p-6">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-950">
        Usuarios
      </h1>

      <p class="mt-1 text-sm text-gray-500">
        Gestiona el acceso, los roles y la vinculación de usuarios
      </p>
    </div>

    @if (permissions.create) {
      <p-button type="button" label="Invitar usuario" icon="pi pi-envelope" (onClick)="onStartInvitation()" />
    }
  </header>

  <section>
    <header class="mb-4">
      <h2 class="text-xl font-semibold text-gray-950">
        Cuentas de usuario
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Consulta el estado y los permisos de acceso a la aplicación
      </p>
    </header>

    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
      <access-user-list [loading]="loading" [editable]="permissions.edit" [users]="data.content" [rows]="data.size" [page]="data.page" [totalRecords]="data.totalElements" (show)="onShowUser($event)" (changeDirection)="onChangeDirection($event)" (changePage)="load($event)" (active)="onSetEnabled($event)" />
    </div>
  </section>

  <p-drawer [visible]="dialog !== Dialog.NONE" (visibleChange)="onDrawerVisibleChange($event)" [closable]="true" position="right" [style]="{ width: 'min(44rem, 100vw)' }">
    @switch (dialog) {
      @case (Dialog.INFO) {
        <ng-template #header>
        <shared-drawer-header title="{{ selectedData.name || selectedData.username }}" icon="pi pi-user" subtitle="{{ selectedData.email }}" />
      </ng-template>

        <div class="w-full min-w-0 px-2 py-4 sm:px-4">
          <access-user-info [user]="selectedData" [member]="member" [loading]="loading" />
        </div>

        <ng-template #footer>
        <shared-drawer-actions [showDelete]="permissions.delete" [showEdit]="permissions.edit" [loading]="loading"
          editLabel="Editar usuario" (delete)="onDelete({ event: $event, user: selectedData })" (edit)="onStartEditing(selectedData)" />
      </ng-template>
      }

      @case (Dialog.INVITE) {
        <ng-template #header>
        <shared-drawer-header title="Invitar usuario" icon="pi pi-user-plus" subtitle="Crea el acceso y asigna sus roles iniciales" />
      </ng-template>

        <div class="w-full min-w-0 px-2 py-4 sm:px-4">
          <access-user-form #fieldsAccessUserForm formId="user-view-invite" [showActions]="false" [create]="true" [selection]="roleSelection" [loading]="loading" [failures]="failures" (save)="onInvite($event)" />
        </div>
        <ng-template #footer>
          <shared-drawer-form-actions
            formId="user-view-invite"
            submitLabel="Enviar invitación"
            submitIcon="pi pi-send"
            [disabled]="!fieldsAccessUserForm.saveEnabled"
            [loading]="fieldsAccessUserForm.formStatus.loading"
            (cancelForm)="onDrawerVisibleChange(false)" />
        </ng-template>
      }

      @case (Dialog.EDIT) {
        <ng-template #header>
        <shared-drawer-header title="Editar usuario" icon="pi pi-pencil" subtitle="Actualiza sus datos, roles y vinculación con un socio" />
      </ng-template>

        <div class="w-full min-w-0 px-2 py-4 sm:px-4">
          <access-user-form #fieldsAccessUserForm formId="user-view-edit" [showActions]="false" [create]="false" [selection]="roleSelection" [member]="member" [members]="members" [loading]="loading" [data]="selectedData" [failures]="failures" (update)="onUpdate($event)" (searchMember)="onSearchMembers($event)" />
        </div>
        <ng-template #footer>
          <shared-drawer-form-actions
            formId="user-view-edit"
            submitLabel="Guardar cambios"
            submitIcon="pi pi-check"
            [disabled]="!fieldsAccessUserForm.saveEnabled"
            [loading]="fieldsAccessUserForm.formStatus.loading"
            (cancelForm)="onCancelEdit()" />
        </ng-template>
      }
    }
  </p-drawer>
</div>
