<p-menu #actionsMenu [model]="actions" [popup]="true" />

<p-table [lazy]="true" dataKey="token" [loading]="loading()" [value]="tokens()" [paginator]="true" [rows]="rows()"
  [totalRecords]="totalRecords()" [first]="first" [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} de {totalRecords}" (onSort)="changeDirection.emit($event)"
  (onPage)="onPageChange($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="username">
        Usuario
        <p-sortIcon field="username" />
      </th>

      <th class="hidden sm:table-cell">
        Token
      </th>

      <th pSortableColumn="scope" class="hidden lg:table-cell">
        Alcance
        <p-sortIcon field="scope" />
      </th>

      <th pSortableColumn="expirationDate" class="hidden md:table-cell">
        Expira
        <p-sortIcon field="expirationDate" />
      </th>

      <th class="w-36">
        Estado
      </th>

      <th class="w-14">
        <span class="sr-only">Acciones</span>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-token>
    <tr>
      <td class="min-w-0">
        <button type="button" class="group block w-full min-w-0 border-0 bg-transparent p-0 text-left"
          (click)="show.emit(token)">
          <span class="block truncate font-medium text-gray-950 group-hover:text-primary">
            {{ token.username }}
          </span>

          <span class="block truncate text-sm text-gray-500 sm:hidden">
            {{ token.name || token.scope }}
          </span>
        </button>
      </td>

      <td class="hidden min-w-0 sm:table-cell">
        <span class="block truncate text-gray-950">
          {{ token.name || 'Sin nombre' }}
        </span>
      </td>

      <td class="hidden min-w-0 lg:table-cell">
        <code
          class="block w-fit max-w-full truncate rounded-md border border-gray-200 bg-gray-50 px-2 py-1 text-xs text-gray-700"
          [title]="token.scope">
          {{ token.scope }}
        </code>
      </td>

      <td class="hidden whitespace-nowrap text-gray-600 md:table-cell">
        {{ token.expirationDate | date:'d MMM y' }}
      </td>

      <td>
        <p-tag [value]="statusLabel(token)" [severity]="statusSeverity(token)" />
      </td>

      <td class="text-right">
        <p-button icon="pi pi-ellipsis-v" severity="secondary" rounded text aria-label="Acciones del token"
          (click)="openActionsMenu($event, token)" />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="6">
        <div class="flex flex-col items-center px-4 py-12 text-center">
          <span class="mb-3 flex size-12 items-center justify-center rounded-full bg-gray-100 text-gray-500">
            <i class="pi pi-key text-xl" aria-hidden="true"></i>
          </span>

          <strong class="text-gray-950">
            No hay tokens
          </strong>

          <span class="mt-1 text-sm text-gray-500">
            Los tokens emitidos aparecerán aquí
          </span>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
