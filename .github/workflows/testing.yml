name: Testing and validation

on: [push, pull_request]

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest

    steps:
    - name: Check-out
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint

  test:
    name: Tests
    needs: linting
    runs-on: ubuntu-latest

    steps:
    - name: Check-out
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build libraries
      run: npm run build-libs
    - name: Run tests
      run: npm test -- --configuration=ci

  test_build:
    name: Test build
    needs: test
    runs-on: ubuntu-latest
  
    steps:
    - name: Check-out
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build libraries
      run: npm run build-libs
    - name: Build
      run: npm run build