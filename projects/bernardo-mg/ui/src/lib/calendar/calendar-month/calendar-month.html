<div class="flex justify-end border-b border-gray-200 p-4">
  <div class="flex items-center gap-2">
    <p-button icon="pi pi-chevron-left" (click)="onGoPrevious()" [disabled]="!canGoPrevious"
      aria-label="Mes anterior" severity="secondary" outlined />
    <p-select [disabled]="selectionDisabled" [ngModel]="month" [options]="selectionMonths" (onChange)="onGoTo($event)"
      optionLabel="label" optionValue="value" aria-label="Mes" />
    <p-button icon="pi pi-chevron-right" (click)="onGoNext()" [disabled]="!canGoNext"
      aria-label="Mes siguiente" severity="secondary" outlined />
  </div>
</div>

<mwl-calendar-month-view [weekStartsOn]="1" [viewDate]="viewDate" [events]="events()"
  [activeDayIsOpen]="activeDayIsOpen" (beforeViewRender)="beforeMonthViewRender($event)"
  (dayClicked)="onSelectDay($event.day)" (eventClicked)="pickDate.emit($event.event)" />
