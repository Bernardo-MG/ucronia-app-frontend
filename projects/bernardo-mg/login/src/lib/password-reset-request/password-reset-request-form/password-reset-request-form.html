<form [formGroup]="form" (ngSubmit)="onSave()" novalidate class="w-full min-w-0 space-y-5">
  <!-- Email -->
  <div class="space-y-2">
    <label for="emailInput" class="block font-medium text-gray-950">Email <span class="text-red-600" aria-hidden="true">*</span></label>

    <input pInputText type="text" id="emailInput" formControlName="email" [invalid]="isFieldInvalid('email')" class="w-full" />
  </div>
  <!-- Submit button -->
  <div class="flex justify-center w-full mt-2">
    <p-button type="submit" label="Solicitar cambio de contraseña" icon="pi pi-envelope" styleClass="h-11 rounded-lg px-4" [disabled]="!saveEnabled" [loading]="loading()"
      [attr.aria-disabled]="!saveEnabled" />
  </div>
</form>
