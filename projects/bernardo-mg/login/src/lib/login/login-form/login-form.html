<form class="space-y-5" [formGroup]="form" (ngSubmit)="onLogin()" novalidate>
  <div>
    <label for="usernameInput" class="mb-2 block text-sm font-semibold text-gray-950">
      Usuario o correo electrónico
    </label>

    <p-iconfield class="block w-full">
      <p-inputicon class="pi pi-envelope" />

      <input pInputText id="usernameInput" type="text" formControlName="username" autocomplete="username"
        placeholder="usuario@ejemplo.com" class="w-full" [attr.aria-invalid]="form.controls['username'].invalid && form.controls['username'].touched" />
    </p-iconfield>

    @if (form.controls['username'].invalid && form.controls['username'].touched) {
      <small class="mt-1 block text-red-600">
        Introduce tu usuario o correo electrónico
      </small>
    }
  </div>

  <div>
    <label for="passwordInput" class="mb-2 block text-sm font-semibold text-gray-950">
      Contraseña
    </label>

    <div class="relative">
      <p-iconfield class="block w-full">
        <p-inputicon class="pi pi-lock" />

        <input pInputText id="passwordInput" [type]="passwordVisible ? 'text' : 'password'" formControlName="password"
          autocomplete="current-password" placeholder="Introduce tu contraseña" class="w-full !pr-12"
          [attr.aria-invalid]="form.controls['password'].invalid && form.controls['password'].touched" />
      </p-iconfield>

      <button type="button"
        class="absolute right-0 top-0 flex h-full w-12 items-center justify-center border-0 bg-transparent text-gray-500 hover:text-gray-950"
        [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="passwordVisible" (click)="togglePasswordVisibility()">
        <i class="pi" [class.pi-eye]="!passwordVisible" [class.pi-eye-slash]="passwordVisible" aria-hidden="true"></i>
      </button>
    </div>

    @if (form.controls['password'].invalid && form.controls['password'].touched) {
      <small class="mt-1 block text-red-600">
        Introduce tu contraseña
      </small>
    }
  </div>

  @if (failedLogin) {
    <p-message id="loginFailedWarning" severity="error" icon="pi pi-exclamation-circle" class="w-full">
      Usuario o contraseña incorrectos
    </p-message>
  }

  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    <div class="flex items-center gap-2">
      <p-checkbox inputId="rememberMe" [binary]="true" [disabled]="waiting" (onChange)="onRememberMe($event.checked)" />

      <label for="rememberMe" class="select-none text-sm text-gray-700">
        Mantener la sesión iniciada
      </label>
    </div>

    <button id="lostPassword" type="button"
      class="border-0 bg-transparent p-0 text-left text-sm font-medium text-primary hover:underline sm:ml-auto"
      [disabled]="waiting" (click)="onLostPassword()">
      ¿Has olvidado tu contraseña?
    </button>
  </div>

  <p-button id="login" type="submit" label="Iniciar sesión" icon="pi pi-sign-in" styleClass="w-full" [loading]="waiting"
    [disabled]="!loginEnabled" [attr.aria-disabled]="!loginEnabled" />
</form>
